name: Build Bookdown
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Install system dependencies
        run: |
          brew update
          brew install pandoc

      - name: Install CRAN & Bioconductor packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")'
         
          # Install BiocManager and Bioconductor packages FIRST
          Rscript -e 'if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")'
          Rscript -e 'BiocManager::install(c("EnhancedVolcano","DESeq2","edgeR","RUVSeq","piano","pcaMethods","impute","imputeLCMD","GEOquery"), ask = FALSE)'
          
          # Pin factoextra
          Rscript -e 'remotes::install_version("factoextra", version = "1.0.7", repos = "https://cran.rstudio.com")'
          
          # Install superheat explicitly
          Rscript -e 'install.packages("superheat", repos = "https://cran.rstudio.com", verbose = TRUE)'
          
          # Install ctxR from GitHub
          Rscript -e 'remotes::install_github("USEPA/ctxR", auth_token = Sys.getenv("GITHUB_TOKEN"))'
          
          # Now install remaining CRAN deps from DESCRIPTION
          Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never")'

      - name: Check package installation
        run: |
          Rscript -e '
            desc <- read.dcf("DESCRIPTION")
            fields <- c("Depends", "Imports", "Suggests")
            fields <- fields[fields %in% colnames(desc)]
            pkgs <- unlist(strsplit(gsub("\\s+", "", desc[, fields]), ","))
            pkgs <- gsub("\\(.*\\)", "", pkgs)
            pkgs <- pkgs[!pkgs %in% c("R", "")]  # exclude R itself
            missing <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
            if (length(missing)) stop("Missing packages: ", paste(missing, collapse = ", "))
            cat("All packages verified OK\n")
          '


      - name: Build bookdown
        run: |
          Rscript -e "bookdown::render_book('index.Rmd', output_format = 'bookdown::gitbook')"

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookdown-book
          path: |
            book/
            book/error.log

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          force_orphan: true